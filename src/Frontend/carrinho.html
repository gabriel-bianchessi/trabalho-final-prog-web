<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu Carrinho - Fake Loja</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        >
        <link rel="stylesheet" href="./src/css/style.css">
    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <a href="index.html" class="navbar-brand mb-0 h1">🛒 Fake Loja</a>
                <div>
                    <a href="index.html" class="btn btn-outline-light me-2">← Voltar às Compras</a>
                    <button class="btn btn-outline-light position-relative" id="cart-button">
                        🛒 Carrinho
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">
                            0
                        </span>
                    </button>
                </div>
            </div>
        </nav>

        <main class="container mt-4">
            <h2 class="mb-4">🛒 Meu Carrinho de Compras</h2>
            
            <div id="status-message" class="alert d-none" role="alert"></div>

            <div class="row">
                <div class="col-lg-8">
                    <div id="cart-items-container">
                        <!-- Itens do carrinho serão renderizados aqui -->
                    </div>
                    <div id="cart-empty-message" class="card text-center py-5 d-none">
                        <div class="card-body">
                            <h3 class="text-muted mb-3">🛒 Seu carrinho está vazio</h3>
                            <p class="text-muted mb-4">Adicione produtos para começar suas compras!</p>
                            <a href="index.html" class="btn btn-primary">Ir às Compras</a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card sticky-top" style="top: 20px;">
                        <div class="card-header bg-dark text-white">
                            <h5 class="mb-0">Resumo do Pedido</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <span id="cart-subtotal">R$ 0,00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Total de itens:</span>
                                <span id="total-items">0</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <strong>Total:</strong>
                                <strong id="cart-total" class="fs-4 text-success">R$ 0,00</strong>
                            </div>
                            <button class="btn btn-success w-100 mb-2" id="checkout-btn">
                                Finalizar Compra
                            </button>
                            <button class="btn btn-outline-danger w-100" id="clear-cart-btn">
                                Limpar Carrinho
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script type="module" src="./src/js/carrinho.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        ></script>
    </body>
</html>
